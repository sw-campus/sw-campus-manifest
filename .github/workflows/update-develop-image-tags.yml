name: Update Develop Image Tags

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-image-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout server repository
        uses: actions/checkout@v4
        with:
          repository: sw-campus/sw-campus-server
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ref: develop
          path: server-repo

      - name: Checkout client repository
        uses: actions/checkout@v4
        with:
          repository: sw-campus/sw-campus-client
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ref: develop
          path: client-repo

      - name: Checkout AI repository
        uses: actions/checkout@v4
        with:
          repository: sw-campus/sw-campus-ai
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ref: develop
          path: ai-repo

      - name: Get latest commit SHAs
        id: get-shas
        run: |
          SERVER_SHA=$(cd server-repo && git rev-parse HEAD | cut -c1-7)
          CLIENT_SHA=$(cd client-repo && git rev-parse HEAD | cut -c1-7)
          AI_SHA=$(cd ai-repo && git rev-parse HEAD | cut -c1-7)

          echo "server_sha=$SERVER_SHA" >> $GITHUB_OUTPUT
          echo "client_sha=$CLIENT_SHA" >> $GITHUB_OUTPUT
          echo "ai_sha=$AI_SHA" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add k8s/environments/develop/values.yaml || true

          cat <<EOF | git commit -F -
chore: develop 이미지 태그 업데이트
  EOF
  
  git remote remove origin || true
  git remote add origin https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/sw-campus/sw-campus-manifest.git
  git push origin develop
