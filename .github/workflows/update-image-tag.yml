name: Update Image Tag

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to update (server/client/ai)'
        required: true
        type: choice
        options:
          - server
          - client
          - ai
  repository_dispatch:
    types: [server-updated, client-updated, ai-updated]

jobs:
  update-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: manifest

      - name: Determine service
        id: service
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ github.event.inputs.service }}"
          elif [ "${{ github.event.action }}" = "server-updated" ]; then
            SERVICE="server"
          elif [ "${{ github.event.action }}" = "client-updated" ]; then
            SERVICE="client"
          elif [ "${{ github.event.action }}" = "ai-updated" ]; then
            SERVICE="ai"
          else
            SERVICE="server"
          fi
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "Service: $SERVICE"

      - name: Checkout service repository
        uses: actions/checkout@v4
        with:
          repository: sw-campus/sw-campus-${{ steps.service.outputs.service }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: service

      - name: Get commit SHA
        id: get-sha
        run: |
          cd service
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=v1.0.0-$SHA" >> $GITHUB_OUTPUT
          echo "Commit SHA: $SHA"
          echo "New tag: v1.0.0-$SHA"

      - name: Update values.yaml
        run: |
          cd manifest
          SERVICE="${{ steps.service.outputs.service }}"
          TAG="${{ steps.get-sha.outputs.tag }}"
          
          # 서비스별로 다른 sed 패턴 사용 (image 섹션 내의 tag만 업데이트)
          if [ "$SERVICE" = "server" ]; then
            sed -i "/^  server:/,/^  [a-z]/ { /^    tag:/ s|tag: v1.0.0.*|tag: ${TAG}| }" k8s/environments/release/values.yaml
          elif [ "$SERVICE" = "client" ]; then
            sed -i "/^  client:/,/^  [a-z]/ { /^    tag:/ s|tag: v1.0.0.*|tag: ${TAG}| }" k8s/environments/release/values.yaml
          elif [ "$SERVICE" = "ai" ]; then
            sed -i "/^  ai:/,/^  [a-z]/ { /^    tag:/ s|tag: v1.0.0.*|tag: ${TAG}| }" k8s/environments/release/values.yaml
          fi
          
          echo "Updated $SERVICE tag to: $TAG"

      - name: Commit and push
        run: |
          cd manifest
          SERVICE="${{ steps.service.outputs.service }}"
          TAG="${{ steps.get-sha.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/environments/release/values.yaml
          git diff --staged --quiet || git commit -m "chore: update $SERVICE image tag to ${TAG}"
          git push

