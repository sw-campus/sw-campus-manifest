apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-develop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sw-campus/sw-campus-manifest
    targetRevision: develop
    path: k8s/charts/monitoring
    helm:
      valueFiles:
        - ../../environments/develop-monitoring/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
