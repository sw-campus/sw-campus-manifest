apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-client
  namespace: default
  labels:
    app: sw-campus-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sw-campus-client
  template:
    metadata:
      labels:
        app: sw-campus-client
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: client
        image: ghcr.io/sw-campus/sw-campus-client:latest
        imagePullPolicy: Always  # 최신 이미지 가져오기
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: sw-campus-client-config
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

