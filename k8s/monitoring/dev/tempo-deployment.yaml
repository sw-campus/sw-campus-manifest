apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-tempo
  namespace: monitoring-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-tempo
  template:
    metadata:
      labels:
        app: dev-tempo
        cluster: dev
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.4.1
          ports:
            - containerPort: 3200