apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-loki
  namespace: monitoring-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-loki
  template:
    metadata:
      labels:
        app: dev-loki
        cluster: dev
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.6
          ports:
            - containerPort: 3100
