apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-loki
  namespace: monitoring-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prod-loki
  template:
    metadata:
      labels:
        app: prod-loki
        cluster: prod
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.6
          ports:
            - containerPort: 3100
