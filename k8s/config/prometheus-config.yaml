apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'sw-campus-cluster'
        environment: 'production'
    
    # Alertmanager 설정 (필요시)
    # alerting:
    #   alertmanagers:
    #     - static_configs:
    #         - targets: ['alertmanager:9093']
    
    # Recording rules (필요시)
    # rule_files:
    #   - /etc/prometheus/rules/*.yml
    
    scrape_configs:
      # OpenTelemetry Collector metrics
      - job_name: 'otel-collector'
        scrape_interval: 10s
        metrics_path: '/metrics'
        static_configs:
          - targets: ['otel-collector:8889']
        relabel_configs:
          - source_labels: [__address__]
            target_label: job
            replacement: 'otel-collector'
      
      # Spring Boot Actuator metrics (Kubernetes 서비스 디스커버리)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
                - monitoring
        relabel_configs:
          # Prometheus annotation이 있는 Pod만 스크랩
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # 메트릭 경로 설정
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # 포트 설정
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # 라벨 추가
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: kubernetes_container_name
      
      # Spring Boot Actuator metrics (직접 설정 - 서비스 디스커버리 실패 시 백업)
      - job_name: 'sw-campus-server'
        scrape_interval: 15s
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['sw-campus-server:8080']
        relabel_configs:
          - source_labels: [__address__]
            target_label: service
            replacement: 'sw-campus-server'
      
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

