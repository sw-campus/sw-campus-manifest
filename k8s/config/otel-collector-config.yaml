apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']
    
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      
      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 1s
      
      # Kubernetes 메타데이터 자동 추가
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - pod_name
            - pod_uid
            - namespace
            - node_name
            - deployment_name
            - service_name
          labels:
            - tag_name: k8s.pod.label.app
              key: app
              from: pod
            - tag_name: k8s.pod.label.version
              key: version
              from: pod
          annotations:
            - tag_name: k8s.pod.annotation.description
              key: description
              from: pod
      
      # 리소스 속성 개선
      resource:
        attributes:
          - key: service.name
            from_attribute: k8s.deployment.name
            action: upsert
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: upsert
          - key: k8s.cluster.name
            value: sw-campus-cluster
            action: upsert
      
      # 메트릭 변환 (더 나은 이름 정규화)
      transform:
        metric_statements:
          - context: metric
            statements:
              # HTTP 메트릭 이름 정규화
              - set(name, "http.server.request.duration") where name == "http.server.duration"
              - set(name, "http.client.request.duration") where name == "http.client.duration"
    
    exporters:
      # Prometheus exporter (메트릭)
      prometheus:
        endpoint: "0.0.0.0:8889"
        const_labels:
          cluster: "sw-campus-cluster"
        metric_expiration: 180m
        enable_open_metrics: true
      
      # Loki exporter (로그)
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
        labels:
          resource:
            service.name: "service_name"
            service.namespace: "service_namespace"
            k8s.namespace.name: "namespace"
            k8s.pod.name: "pod_name"
            k8s.deployment.name: "deployment"
          attributes:
            http.method: "http_method"
            http.status_code: "http_status_code"
            http.route: "http_route"
            log.level: "level"
        default_labels_enabled:
          exporter: false
          job: true
      
      # Tempo exporter (트레이스)
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
        headers:
          X-Scope-OrgID: "tempo"
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/tempo]
        
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, resource, transform, batch]
          exporters: [prometheus]
        
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [loki]

