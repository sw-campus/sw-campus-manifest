apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-server
  labels:
    app: sw-campus-server
spec:
  replicas: 2            # 🔥 develop(1) → release(2 이상)
  selector:
    matchLabels:
      app: sw-campus-server
  template:
    metadata:
      labels:
        app: sw-campus-server
    spec:
      containers:
        - name: server
          image: ghcr.io/sw-campus/sw-campus-server:release   # 🔥 태그 변경
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sw-campus-server-config
