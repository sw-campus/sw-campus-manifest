# Release monitoring environment values
# 기본값이 이미 운영 환경 기준이므로 거의 변경 없음

global:
  namespace: monitoring
  env: release

monitoring:
  targetNamespace: release

grafana:
  ingress:
    enabled: true
    host: grafana.monitoring.softwarecampus.co.kr
    ingressClassName: alb
    scheme: internet-facing
    targetType: ip
    inboundCidrs: []
    certificateArn: arn:aws:acm:ap-northeast-2:991243792313:certificate/497c06da-5c46-45f6-8adf-cfd0ec28ec9c

