# Release monitoring environment values
# 기본값이 이미 운영 환경 기준이므로 거의 변경 없음

global:
  namespace: monitoring
  env: release

monitoring:
  targetNamespace: release

grafana:
  ingress:
    enabled: true
    host: grafana.monitoring.softwarecampus.co.kr
    ingressClassName: alb
    scheme: internet-facing
    targetType: ip

loki:
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp2

