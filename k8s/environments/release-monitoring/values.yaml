# Release monitoring environment values
global:
  namespace: release

grafana:
  enabled: true
  replicas: 2
  image:
    repository: grafana/grafana
    tag: "10.4.2"
    pullPolicy: IfNotPresent

prometheus:
  enabled: true
  replicas: 2
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
    pullPolicy: IfNotPresent

loki:
  enabled: true
  replicas: 2
  image:
    repository: grafana/loki
    tag: "2.9.6"
    pullPolicy: IfNotPresent

tempo:
  enabled: true
  replicas: 2
  image:
    repository: grafana/tempo
    tag: "2.4.1"
    pullPolicy: IfNotPresent

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "2.9.6"
    pullPolicy: IfNotPresent

otelCollector:
  enabled: true
  replicas: 2
  image:
    repository: otel/opentelemetry-collector
    tag: "0.96.0"
    pullPolicy: IfNotPresent

configMaps:
  grafanaDashboards:
    enabled: true
  grafanaDatasources:
    enabled: true
  lokiConfig:
    enabled: true
  otelCollectorConfig:
    enabled: true
  promtailConfig:
    enabled: true

