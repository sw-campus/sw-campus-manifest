global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server (Spring Boot)
# =========================
server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Spring profile
  configMap:
    name: sw-campus-server-config-release

  # 공통 서버 시크릿 (JWT, MAIL 등)
  secret:
    enabled: true
    name: sw-campus-server-secret-release
  
  # DB / 외부 연동 Secret
  dbSecret:
   enabled: true
   name: sw-campus-db-secret-release

  # AWS
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  # OAuth
  oauthSecret:
    enabled: true
    name: sw-campus-oauth-secret-release

  # SSH 터널링용 Secret
  infraSecret:
    enabled: false


# =========================
# Client (React)
# =========================
client:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: v1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  configMap:
    name: sw-campus-client-config


# =========================
# AI Service
# =========================
ai:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi


# =========================
# Database (External)
# =========================
database:
  enabled: false

# =========================
# Ingress settings (기본값 오버라이드)
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # ✅ 아키텍처: 백엔드(서버, AI, DB)는 프론트엔드를 통해서만 접근 가능
    # 따라서 ALB 헬스체크는 클라이언트(프론트엔드)만 체크하면 됨
    # 서버, AI는 클러스터 내부에서만 접근 가능하므로 ALB 헬스체크 불필요
    # Kubernetes probe (liveness/readiness)가 내부에서 헬스체크를 담당함
    # ⚠️ 보안 중요: Ingress에 /actuator 경로 없음 → 외부에서 /actuator 접근 불가능
    # ALB는 기본 헬스체크를 사용하거나, 필요시 클라이언트 루트 경로(/)만 체크
    # alb.ingress.kubernetes.io/healthcheck-path: /
    # alb.ingress.kubernetes.io/success-codes: "200"

  certificateArn: ""

  hosts:
    - host: softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

    - host: www.softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080
