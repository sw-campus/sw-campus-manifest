global:
  namespace: release
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ✅ profile = release
  configMap:
    name: sw-campus-server-config-release
    data:
      SPRING_PROFILES_ACTIVE: prod

  # ✅ DB Secret = release
  secret:
    enabled: true
    name: sw-campus-server-secret-release
  
  # ✅ InfraSecret: SSH 터널링용 (release 환경에서는 활성화 - EC2 DB 사용)
  infraSecret:
    enabled: true
    name: sw-campus-infra-secret-release

client:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: 30081
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

# Database configuration (release: EC2 DB 사용, SSH 터널링 필요)
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: localhost  # SSH 터널링을 통해 localhost:5432로 접근
    port: 5432

configMaps:
  server:
    enabled: true
  client:
    enabled: true
