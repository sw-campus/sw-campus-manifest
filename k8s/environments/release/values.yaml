global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server (Spring Boot)
# =========================
server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Spring profile
  configMap:
    name: sw-campus-server-config-release

  # 공통 서버 시크릿 (JWT, MAIL 등)
  secret:
    enabled: true
    name: sw-campus-server-secret-release
  # ✅ DB / 외부 연동 Secret
  dbsecret:
    enabled: true
    name: sw-campus-db-secret-release

  # 역할별 추가 시크릿 (🔥 핵심)
  awsSecret: sw-campus-aws-secret-release
  dbSecret: sw-campus-db-secret-release
  oauthSecret: sw-campus-oauth-secret-release


  infraSecret:
    enabled: false


# =========================
# Client (React)
# =========================
client:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: v1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  configMap:
    name: sw-campus-client-config


# =========================
# AI Service
# =========================
ai:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi


# =========================
# Database (External)
# =========================
database:
  enabled: false
