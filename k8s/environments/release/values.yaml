global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server (Spring Boot)
# =========================
server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "v1.0.27"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 300m
      memory: 768Mi

  # Spring profile
  configMap:
    name: sw-campus-server-config-release

  # ✅ Redis Sidecar (Server 파드에 포함)
  redis:
    enabled: true
    image: redis:7-alpine

  # 공통 서버 시크릿 (JWT, MAIL 등)
  secret:
    enabled: true
    name: sw-campus-server-secret-release

  # DB / 외부 연동 Secret
  dbSecret:
    enabled: true
    name: sw-campus-db-secret-release

  # AWS
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  # OAuth
  oauthSecret:
    enabled: true
    name: sw-campus-oauth-secret-release

  # Google Analytics
  gaSecret:
    enabled: true
    name: ga-credentials-release

  # SSH 터널링용 Secret
  infraSecret:
    enabled: false

# =========================
# Client (React)
# =========================
client:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "v1.0.29"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  configMap:
    name: sw-campus-client-config

  # Gemini API Key Secret
  secret:
    enabled: true
    name: sw-campus-client-secret-release

# =========================
# AI Service
# =========================
ai:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "v1.0.10"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

# =========================
# Database (External)
# =========================
database:
  enabled: false

# =========================
# Ingress settings (기본값 오버라이드)
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # 🔥 HTTPS 고정 핵심
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ALB 헬스체크
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"

  hosts:
    - host: softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000

        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

        - path: /ocr
          pathType: Prefix
          service:
            name: sw-campus-ai
            port: 8000

    - host: www.softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000

        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

        - path: /ocr
          pathType: Prefix
          service:
            name: sw-campus-ai
            port: 8000
