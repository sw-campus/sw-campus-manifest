# Release environment values
global:
  namespace: release
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

client:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: 30081
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi


ai:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: v1.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi


database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: ip-172-16-2-174.ap-northeast-2.compute.internal
    port: 5432

configMaps:
  server:
    enabled: true
  client:
    enabled: true

