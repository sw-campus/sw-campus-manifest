global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server (Spring Boot)
# =========================
server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Spring profile
  configMap:
    name: sw-campus-server-config-release

  # 공통 서버 시크릿 (JWT, MAIL 등)
  secret:
    enabled: true
    name: sw-campus-server-secret-release
  
  # DB / 외부 연동 Secret
  dbSecret:
   enabled: true
   name: sw-campus-db-secret-release

  # AWS
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  # OAuth
  oauthSecret:
    enabled: true
    name: sw-campus-oauth-secret-release

  # SSH 터널링용 Secret
  infraSecret:
    enabled: false

  # 환경변수 설정
  env:
    - name: MANAGEMENT_METRICS_EXPORT_OTLP_ENABLED
      value: "false"  # ❌ OTLP 메트릭스 export 비활성화 (연결 실패 에러 방지)


# =========================
# Client (React)
# =========================
client:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  configMap:
    name: sw-campus-client-config


# =========================
# AI Service
# =========================
ai:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi


# =========================
# Database (External)
# =========================
database:
  enabled: false

# =========================
# Ingress settings (기본값 오버라이드)
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance  # ALB가 NodePort로 트래픽 라우팅
    # ✅ ALB 헬스체크 설정 (서버 타겟그룹용)
    # SecurityConfig에서 /actuator/health/**가 permitAll로 허용되어 있음
    # management.health.db/redis.enabled: false로 설정되어 DB/Redis 체크 제외
    # → /actuator/health/readiness는 항상 200 반환 (인증 불필요, DB 체크 없음)
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"  # ⚠️ 반드시 명시 (기본값 200-399여도 401 에러 방지)

  certificateArn: ""

  # ⚠️ 임시: 도메인 연동 전까지 모든 호스트 허용 (와일드카드)
  # 내일 도메인 연동 시 아래 주석을 해제하고 실제 도메인으로 변경
  hosts:
    # - host: softwarecampus.co.kr
    #   paths:
    #     - path: /
    #       pathType: Prefix
    #       service:
    #         name: sw-campus-client
    #         port: 3000
    #     - path: /api
    #       pathType: Prefix
    #       service:
    #         name: sw-campus-server
    #         port: 8080
    # - host: www.softwarecampus.co.kr
    #   paths:
    #     - path: /
    #       pathType: Prefix
    #       service:
    #         name: sw-campus-client
    #         port: 3000
    #     - path: /api
    #       pathType: Prefix
    #       service:
    #         name: sw-campus-server
    #         port: 8080
    # 임시: 모든 호스트 허용 (host 필드 없음)
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080
