global:
  namespace: release
  imagePullSecrets:
    - ghcr-secret

# =========================
# Server (Spring Boot)
# =========================
server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ✅ Spring profile
  configMap:
    name: sw-campus-server-config-release
    data:
      SPRING_PROFILES_ACTIVE: prod

  # ✅ DB / 외부 연동 Secret
  secret:
    enabled: true
    name: sw-campus-server-secret-release

  # ✅ AWS (S3) 
  env:
  - name: aws.credentials.access-key
    valueFrom:
      secretKeyRef:
        name: sw-campus-aws-secret
        key: aws.credentials.access-key
  - name: aws.credentials.secret-key
    valueFrom:
      secretKeyRef:
        name: sw-campus-aws-secret
        key: aws.credentials.secret-key
  - name: aws.region
    valueFrom:
      secretKeyRef:
        name: sw-campus-aws-secret
        key: AWS_REGION


  # ❌ SSH 터널링 완전 제거
  infraSecret:
    enabled: false


# =========================
# Client (React)
# =========================
client:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: v1.0.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  configMap:
    name: sw-campus-client-config


# =========================
# AI Service
# =========================
ai:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi


# =========================
# Database (External)
# =========================
database:
  enabled: false


# =========================
# ConfigMaps
# =========================
configMaps:
  server:
    enabled: true
  client:
    enabled: true
