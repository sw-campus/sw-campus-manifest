apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sw-campus-develop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/sw-campus/sw-campus-manifest
    targetRevision: develop
    path: k8s/charts/sw-campus
    helm:
      valueFiles:
        - ../../environments/develop/values.yaml
    
  destination:
    server: https://kubernetes.default.svc
    namespace: develop
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # 주기적으로 Git 변경사항 체크 (3분마다)
    refresh:
      interval: 3m

