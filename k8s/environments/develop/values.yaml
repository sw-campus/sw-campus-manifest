global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "b74ff9f58f9dbedc5bc16d122dafbf4b37dcab0d"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ✅ ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      SPRING_PROFILES_ACTIVE: staging

  # ✅ Secret: DB 정보만
  secret:
    enabled: true
    name: sw-campus-server-secret-develop
  
  # ✅ InfraSecret: SSH 터널링용 (develop 환경에서는 비활성화 - 로컬 DB 사용)
  infraSecret:
    enabled: false
    name: sw-campus-infra-secret-develop

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "develop"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "develop"
    pullPolicy: IfNotPresent

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres  # VM 리눅스 서버의 로컬 DB 서비스명
    port: 5432

configMaps:
  server:
    enabled: true
  client:
    enabled: true
