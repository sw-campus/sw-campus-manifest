# Develop environment values
global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "develop"  # CI/CD에서 commit SHA로 덮어쓰기 또는 기본값으로 사용
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-server-config
    data:
      SPRING_PROFILES_ACTIVE: staging
  secret:
    enabled: true
    name: sw-campus-server-secret

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "dev-b9b3e554f4c948107bbe1d1c3f50b6a5830449c2"  # CI/CD에서 commit SHA로 덮어쓰기 또는 기본값으로 사용
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "develop"  # CI/CD에서 commit SHA로 덮어쓰기 또는 기본값으로 사용
    pullPolicy: IfNotPresent

database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres  
    port: 5432

configMaps:
  server:
    enabled: true
  client:
    enabled: true

