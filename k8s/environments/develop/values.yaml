global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "develop"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ✅ ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      GITHUB_REDIRECT_URI: "https://localhost:8080/api/auth/oauth/github/callback"
      GOOGLE_REDIRECT_URI: "https://localhost:8080/api/auth/oauth/google/callback"

  # ✅ Secret: JWT, MAIL 등
  secret:
    enabled: true
    name: sw-campus-server-secret-develop

  # ✅ DB Secret
  dbSecret:
    enabled: true
    name: sw-campus-db-secret-develop

  # ✅ AWS Secret (S3)
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-develop

  # ✅ OAuth Secret
  oauthSecret:
    enabled: true
    name: sw-campus-oauth-secret-develop

  # ✅ Google Analytics Secret
  gaSecret:
    enabled: true
    name: ga-credentials-develop

  # ✅ InfraSecret: SSH 터널링용 (develop 환경에서는 비활성화)
  infraSecret:
    enabled: false

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "develop"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "develop"
    pullPolicy: IfNotPresent

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: false

configMaps:
  server:
    enabled: true
  client:
    enabled: true
