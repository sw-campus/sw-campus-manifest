global:
  namespace: develop
  imagePullSecrets:
    - name: ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "RHSA-1ae06824750636facaf9aaedeb42777ab8c2499c"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      GITHUB_REDIRECT_URI: "https://localhost:8080/api/auth/oauth/github/callback"
      GOOGLE_REDIRECT_URI: "https://localhost:8080/api/auth/oauth/google/callback"
      cors.allowed-origins: "http://localhost:3000,http://172.30.1.83:3000"

  # Redis Sidecar (Server 파드에 포함)
  redis:
    enabled: true
    image: redis:7-alpine

  # Secret: JWT, MAIL 
  serverSecret:
    enabled: true
    name: sw-campus-server-secret-develop

  # DB Secret
  dbsecret:
    enabled: true
    name: sw-campus-db-secret-develop

  # AWS Secret (S3)
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-develop

  # OAuth Secret
  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-develop

  # Google Analytics 
  gaSecret:
    enabled: true
    name: ga-credentials-develop

  # InfraSecret: SSH 터널링용 
  infraSecret:
    enabled: false

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "RHSA-446de12b85fb117618327f314cfe1363103b4d5c"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "RHSA-fcceaaf00a185dbed1af703c42b56cffc587a82d"
    pullPolicy: IfNotPresent

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: false

# Ingress (develop: 로컬 환경이라 비활성화, 포트포워딩 사용)
ingress:
  enabled: false

configMaps:
  server:
    enabled: true
  client:
    enabled: true
