global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "develop"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ✅ ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      GITHUB_REDIRECT_URI: "https://localhost:8080/api/auth/oauth/github/callback"
      GOOGLE_REDIRECT_URI: "https://localhost:8080/api/auth/oauth/google/callback"

  # ✅ Secret: DB 정보만
  secret:
    enabled: true
    name: sw-campus-server-secret-develop

  # ✅ InfraSecret: SSH 터널링용 (develop 환경에서는 비활성화 - 로컬 DB 사용)
  infraSecret:
    enabled: false
    name: sw-campus-infra-secret-develop

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "dev-0a1eee4aa9b32d4a67dc2ed4c7d2a7a3f00723bc"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "develop"
    pullPolicy: IfNotPresent

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: false

configMaps:
  server:
    enabled: true
  client:
    enabled: true
