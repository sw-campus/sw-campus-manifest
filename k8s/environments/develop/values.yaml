global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "1ab61b7dcb3e63f601ac0d6d7a7fde9b36c4e031"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ✅ ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      SPRING_PROFILES_ACTIVE: staging

  # ✅ Secret: DB 정보만
  secret:
    enabled: true
    name: sw-campus-server-secret-develop

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "develop"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "develop"
    pullPolicy: IfNotPresent

configMaps:
  server:
    enabled: true
  client:
    enabled: true
