global:
  namespace: develop
  imagePullSecrets:
    - name: ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "RHSA-da09ae391d34ade8bbb29feae43d78e0bad55e45"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      GITHUB_REDIRECT_URI: "http://api-dev.softwarecampus.co.kr/api/auth/oauth/github/callback"
      GOOGLE_REDIRECT_URI: "http://api-dev.softwarecampus.co.kr/api/auth/oauth/google/callback"
      KAKAO_REDIRECT_URI: "http://api-dev.softwarecampus.co.kr/api/auth/oauth/kakao/callback"
      cors.allowed-origins: "http://api-dev.softwarecampus.co.kr"

  # Redis Sidecar (Server 파드에 포함)
  redis:
    enabled: true
    image: redis:7-alpine

  # Secret: JWT, MAIL
  serverSecret:
    enabled: true
    name: sw-campus-server-secret-develop

  # DB Secret
  dbsecret:
    enabled: true
    name: sw-campus-db-secret-develop

  # AWS Secret (S3)
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-develop

  # OAuth Secret
  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-develop

  # Google Analytics
  gaSecret:
    enabled: true
    name: ga-credentials-develop
    
  # InfraSecret: SSH 터널링용 
  infraSecret:
    enabled: false

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "RHSA-f9521a1b26e5a72be402b9525d6a9257a9a3dc03"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "RHSA-fcceaaf00a185dbed1af703c42b56cffc587a82d"
    pullPolicy: IfNotPresent

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: false

# Ingress
ingress:
  enabled: true
  className: nginx

  annotations:
    kubernetes.io/ingress.class: nginx

  hosts:
    - host: api-dev.softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000

        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

        - path: /ocr
          pathType: Prefix
          service:
            name: sw-campus-ai
            port: 8000


