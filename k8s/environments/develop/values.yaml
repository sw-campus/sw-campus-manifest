global:
  namespace: develop
  imagePullSecrets:
    - name: ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "RHSA-b92e5d64e10a3b1bc4f0eec4828a95257af5be56"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30081
    
  # ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      GITHUB_REDIRECT_URI: "https://sw-campus-dev.tail0ffc99.ts.net/api/auth/oauth/github/callback"
      GOOGLE_REDIRECT_URI: "https://sw-campus-dev.tail0ffc99.ts.net/api/auth/oauth/google/callback"
      KAKAO_REDIRECT_URI: "https://sw-campus-dev.tail0ffc99.ts.net/api/auth/oauth/kakao/callback"
      cors.allowed-origins: "https://sw-campus-dev.tail0ffc99.ts.net"

  # Redis Sidecar (Server 파드에 포함)
  redis:
    enabled: true
    image: redis:7-alpine

  # Secret: JWT, MAIL 
  serverSecret:
    enabled: true
    name: sw-campus-server-secret-develop

  # DB Secret
  dbsecret:
    enabled: true
    name: sw-campus-db-secret-develop

  # AWS Secret (S3)
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-develop

  # OAuth Secret
  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-develop

  # Google Analytics 
  gaSecret:
    enabled: true
    name: ga-credentials-develop
    
  # InfraSecret: SSH 터널링용 
  infraSecret:
    enabled: false

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "RHSA-93c1bc85312dab1efc8550c61e7d6042c820cd9d"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30080

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "RHSA-fcceaaf00a185dbed1af703c42b56cffc587a82d"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8000
    targetPort: 8000
    nodePort: 30082

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: false

# Ingress
ingress:
  enabled: false