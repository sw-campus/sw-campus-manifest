# Develop environment values
global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "develop"  # CI/CD에서 commit SHA로 덮어쓰기 또는 기본값으로 사용
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-server-config
    data:
      SPRING_PROFILES_ACTIVE: staging
      # TODO: 실제 데이터베이스 서버 주소로 변경 필요 (환경 변수 또는 별도 설정 파일 사용 권장)
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.30.1.83:5432/swcampus
      SPRING_DATASOURCE_USERNAME: postgres
  secret:
    enabled: true
    name: sw-campus-server-secret

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "develop"  # CI/CD에서 commit SHA로 덮어쓰기 또는 기본값으로 사용
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "develop"  # CI/CD에서 commit SHA로 덮어쓰기 또는 기본값으로 사용
    pullPolicy: IfNotPresent

database:
  enabled: false
  externalService:
    name: postgres-service
    externalName: postgres  
    port: 5432

configMaps:
  server:
    enabled: true
  client:
    enabled: true

