global:
  namespace: develop
  imagePullSecrets:
    - name: ghcr-secret

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: "RHSA-43c2118733ae1c48e3c5dc9ea812deefa983613f"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
    
  # ConfigMap: profile 같은 비민감 정보만
  configMap:
    name: sw-campus-server-config-develop
    data:
      GITHUB_REDIRECT_URI: "https://sw-campus-dev.tail0ffc99.ts.net/api/auth/oauth/github/callback"
      GOOGLE_REDIRECT_URI: "https://sw-campus-dev.tail0ffc99.ts.net/api/auth/oauth/google/callback"
      KAKAO_REDIRECT_URI: "https://sw-campus-dev.tail0ffc99.ts.net/api/auth/oauth/kakao/callback"
      cors.allowed-origins: "https://sw-campus-dev.tail0ffc99.ts.net"

  # Redis Sidecar (Server 파드에 포함)
  redis:
    enabled: true
    image: redis:7-alpine

  # Secret: JWT, MAIL 
  serverSecret:
    enabled: true
    name: sw-campus-server-secret-develop

  # DB Secret
  dbsecret:
    enabled: true
    name: sw-campus-db-secret-develop

  # AWS Secret (S3)
  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-develop

  # OAuth Secret
  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-develop

  # Google Analytics 
  gaSecret:
    enabled: true
    name: ga-credentials-develop
    
  # InfraSecret: SSH 터널링용 
  infraSecret:
    enabled: false

client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: "RHSA-66ab88f3c0e117a9826f2324590dc5be7bd26a09"
    pullPolicy: IfNotPresent
  configMap:
    name: sw-campus-client-config
    data:
      NODE_ENV: "production"

ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: "RHSA-9503351043a8eab5e2019288f0a70cc3d1d7057d"
    pullPolicy: IfNotPresent

# Database configuration (develop: 로컬 DB 사용)
database:
  enabled: false

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: sw-campus-dev.tail0ffc99.ts.net
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080
