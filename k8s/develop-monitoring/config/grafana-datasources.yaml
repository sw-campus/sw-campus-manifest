apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-grafana-datasources
  namespace: monitoring-dev
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://dev-prometheus.monitoring-dev:9090
        isDefault: true

      - name: Loki
        type: loki
        access: proxy
        url: http://dev-loki.monitoring-dev:3100

      - name: Tempo
        type: tempo
        access: proxy
        url: http://dev-tempo.monitoring-dev:3200
