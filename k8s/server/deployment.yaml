apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sw-campus-server
  template:
    metadata:
      labels:
        app: sw-campus-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: server
          image: ghcr.io/sw-campus/sw-campus-server:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: DB_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: DB_PASSWORD

            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: MAIL_USERNAME

            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: MAIL_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: JWT_SECRET

            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: AWS_ACCESS_KEY

            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: AWS_SECRET_KEY

            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: AWS_REGION

            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: sw-campus-server-secret
                  key: AWS_S3_BUCKET

          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: sw-campus-server-config
