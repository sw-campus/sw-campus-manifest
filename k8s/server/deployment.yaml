apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sw-campus-server
  template:
    metadata:
      labels:
        app: sw-campus-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: server
          image: ghcr.io/sw-campus/sw-campus-server:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: SPRING_CONFIG_LOCATION
              value: classpath:/config/
          ports:
            - containerPort: 8080
