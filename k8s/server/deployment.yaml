apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-server
  namespace: default
  labels:
    app: sw-campus-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sw-campus-server
  template:
    metadata:
      labels:
        app: sw-campus-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret     # 🔥 Private 이미지 Pull
      containers:
        - name: server
          image: ghcr.io/sw-campus/sw-campus-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sw-campus-server-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
