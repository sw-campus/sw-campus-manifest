# Default values for sw-campus
# 환경별 values 파일에서 오버라이드됨

# Global settings
global:
  namespace: develop
  imagePullSecrets:
    - ghcr-secret

# Server configuration
server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: develop
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  configMap:
    name: sw-campus-server-config-release
  secret:
    enabled: true
    name: sw-campus-server-secret-release
  awsSecret: sw-campus-aws-secret-release
  dbSecret: sw-campus-db-secret-release
  oauthSecret: sw-campus-oauth-secret-release

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Client configuration
client:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: develop
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: 30080
  configMap:
    name: sw-campus-client-config
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# AI configuration
ai:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: develop
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Database configuration
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres
    port: 5432

# =========================
# Ingress settings
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: 200-399

  certificateArn: "" 

  hosts:
    - host: softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000

    - host: www.softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
            

# =========================
# ConfigMaps
configMaps:
  server:
    enabled: true
  client:
    enabled: true
