# =========================
# Global settings
# =========================
global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server settings
# =========================
server:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: v1.0.0  # 환경별 values.yaml에서 커밋 SHA 기반 태그로 override
    pullPolicy: IfNotPresent

  service:
    type: NodePort  # ALB target-type: instance 사용을 위해 NodePort 필요
    port: 8080
    targetPort: 8080

  # ✅ Server ConfigMap (유일한 ConfigMap 정의)
  configMap:
    name: sw-campus-server-config-release
    data:
      server.port: "8080"
      cors.allowed-origins: https://www.softwarecampus.co.kr,https://softwarecampus.co.kr

      # ✅ Actuator 헬스체크 설정 (Kubernetes Probe 전용)
      # ⚠️ 보안 중요: include: health만 노출 (health만!)
      # - /actuator/env, /actuator/beans, /actuator/metrics 등은 노출 안 됨
      # - Kubernetes probe는 Pod 내부에서 localhost 접근 (외부 노출 아님)
      # - Ingress에는 /actuator 경로 없음 (외부 접근 차단됨)
      # - application.yml의 기본 base-path(/actuator) 사용
      # - Spring Boot는 환경변수에서 점(.)을 언더스코어(_)로 변환하여 인식
      # - probes.enabled: true는 application.yml에 이미 설정되어 있음
      management.endpoints.web.exposure.include: health
      management.endpoint.health.probes.enabled: "true"
      # ✅ readiness probe에서 DB/Redis/Mail 제외 (운영 정석)
      # DB/Redis/Mail 연결 문제가 있어도 웹 서버 준비되면 트래픽 수신 가능
      # readiness = 웹서버 준비 여부만 체크
      management.health.db.enabled: "false"
      management.health.redis.enabled: "false"
      management.health.mail.enabled: "false"   # ⭐ Mail health check 비활성화 (130초 블로킹 방지)

  serverSecret:
    enabled: true
    name: sw-campus-server-secret-release

  dbsecret:
    enabled: true
    name: sw-campus-db-secret-release

  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-release

  env:
    # ✅ SPRING_PROFILES_ACTIVE는 server-configmap.yaml 템플릿에서 자동 관리됨
    # - namespace가 "release" → "prod"
    # - 그 외 → "staging"
    # - 중복 정의 제거 (env에서 하드코딩 시 develop 환경에서도 prod가 강제되는 문제 방지)
    - name: SPRING_BATCH_JOB_ENABLED
      value: "false"
    - name: SPRING_BATCH_JOB_NAMES
      value: "NONE"
    - name: JAVA_TOOL_OPTIONS
      value: "-Djava.net.preferIPv4Stack=true"

  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1.5Gi

  # ✅ 헬스체크 설정 (HTTP 기반 - Spring 진짜 준비 상태 확인)
  # ⚠️ livenessProbe는 실패 시 Pod 재시작으로 인한 문제 발생 가능 → 제거
  # ALB + readinessProbe만으로 충분한 헬스체크 제공
  # HTTP 사용: Spring Context / Security / Filter 체인까지 모두 준비된 상태만 Ready
  # /actuator/health/readiness는 DB/Redis/Mail 체크 없이 즉시 200 반환 (인증 불필요)
  # TCP는 포트만 열리면 OK라서 실제 요청 처리 불가능한 상태에서도 Ready 될 수 있음
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 120  # 앱 시작 시간(143초) 고려하여 여유있게
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # ❌ livenessProbe 제거 (Pod 재시작 문제 방지)

# =========================
# Client settings
# =========================
client:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  configMap:
    name: sw-campus-client-config

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =========================
# AI settings
# =========================
ai:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# =========================
# Database configuration
# =========================
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres
    port: 5432

# =========================
# Ingress settings (ALB)
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance  # ALB가 NodePort로 트래픽 라우팅

    # ✅ ALB 헬스체크 설정 (서버 타겟그룹용)
    # SecurityConfig에서 /actuator/health/**가 permitAll로 허용되어 있음
    # management.health.db/redis/mail.enabled: false로 설정되어 DB/Redis/Mail 체크 제외
    # → /actuator/health/readiness는 항상 200 반환 (인증 불필요, DB/Redis/Mail 체크 없음)
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"  # ⚠️ 반드시 명시 (기본값 200-399여도 401 에러 방지)

  hosts:
    - paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000

        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

# =========================
# Helm template guard
# =========================
configMaps:
  server:
    enabled: true
  client:
    enabled: true
