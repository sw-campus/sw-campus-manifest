# =========================
# Global settings
# =========================
global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server settings
# =========================
server:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: release
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  # ✅ Server ConfigMap (유일한 ConfigMap 정의)
  configMap:
    name: sw-campus-server-config-release
    data:
      server.port: "8080"
      cors.allowed-origins: https://www.softwarecampus.co.kr,https://softwarecampus.co.kr

      # 🔧 Actuator 설정 (Kubernetes Probe용)
      # 참고: HealthController의 /health를 주로 사용하고, Actuator는 보조적으로 사용
      # Kubernetes probe는 클러스터 내부에서 Pod에 직접 접근하므로 안전하게 사용 가능
      # Spring Boot는 환경변수에서 점(.)을 언더스코어(_)로 변환하여 인식
      management.endpoints.web.exposure.include: health
      management.endpoints.web.base-path: /
      management.endpoint.health.probes.enabled: "true"

  serverSecret:
    enabled: true
    name: sw-campus-server-secret-release

  dbsecret:
    enabled: true
    name: sw-campus-db-secret-release

  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-release

  env:
    - name: SPRING_PROFILES_ACTIVE
      value: release
    - name: SPRING_BATCH_JOB_ENABLED
      value: "false"
    - name: SPRING_BATCH_JOB_NAMES
      value: "NONE"
    - name: JAVA_TOOL_OPTIONS
      value: "-Djava.net.preferIPv4Stack=true"

  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1.5Gi

  # ✅ Probes → HealthController의 /health 엔드포인트 사용
  # HealthController가 있고 SecurityConfig에서 permitAll로 설정되어 있어 안전하게 사용 가능
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5

# =========================
# Client settings
# =========================
client:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  configMap:
    name: sw-campus-client-config

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =========================
# AI settings
# =========================
ai:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# =========================
# Database configuration
# =========================
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres
    port: 5432

# =========================
# Ingress settings (ALB)
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # ✅ 아키텍처: 백엔드(서버, AI, DB)는 프론트엔드를 통해서만 접근 가능
    # 따라서 ALB 헬스체크는 클라이언트(프론트엔드)만 체크하면 됨
    # 서버, AI는 클러스터 내부에서만 접근 가능하므로 ALB 헬스체크 불필요
    # Kubernetes probe (liveness/readiness)가 내부에서 헬스체크를 담당함
    # ALB는 기본 헬스체크를 사용하거나, 필요시 클라이언트 루트 경로(/)만 체크
    # alb.ingress.kubernetes.io/healthcheck-path: /
    # alb.ingress.kubernetes.io/success-codes: "200"

  hosts:
    - paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000

        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

# =========================
# Helm template guard
# =========================
configMaps:
  server:
    enabled: true
  client:
    enabled: true
