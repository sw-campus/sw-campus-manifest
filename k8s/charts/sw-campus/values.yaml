# Default values for sw-campus

# =========================
# Global settings
# =========================
global:
  namespace: release
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server settings
# =========================
server:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  configMap:
    name: sw-campus-server-config-release

  serverSecret:
    enabled: true
    name: sw-campus-server-secret-release

  dbsecret:
    enabled: true
    name: sw-campus-db-secret-release

  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-release

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3


# =========================
# Client settings
# =========================
client:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  configMap:
    name: sw-campus-client-config

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi


# =========================
# AI settings
# =========================
ai:
  enabled: true 
  replicas: 2

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi


# =========================
# Database configuration
# =========================
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres
    port: 5432

# =========================
# Ingress settings
# =========================
ingress:
  enabled: true
  className: alb

  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: 200-399

  certificateArn: "" 

  hosts:
    - host: softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080

    - host: www.softwarecampus.co.kr
      paths:
        - path: /
          pathType: Prefix
          service:
            name: sw-campus-client
            port: 3000
        - path: /api
          pathType: Prefix
          service:
            name: sw-campus-server
            port: 8080
            

# =========================
# ConfigMaps
# =========================
configMaps:
  server:
    enabled: true
  client:
    enabled: true
