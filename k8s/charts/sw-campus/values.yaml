# Default values for sw-campus

global:
  namespace: develop
  imagePullSecrets:
    - name: ghcr-secret

# =========================
# Server configuration
# =========================
server:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-server
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  configMap:
    name: sw-campus-server-config-release

  serverSecret:
    enabled: true
    name: sw-campus-server-secret-release

  dbsecret:
    enabled: true
    name: sw-campus-db-secret-release

  awsSecret:
    enabled: true
    name: sw-campus-aws-secret-release

  oauth2Secret:
    enabled: true
    name: sw-campus-oauth-secret-release

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi


# =========================
# Client configuration
# =========================
client:
  enabled: true
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-client
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 3000
    nodePort: 30080

  configMap:
    name: sw-campus-client-config

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi


# =========================
# AI configuration
# =========================
ai:
  enabled: true 
  replicas: 1

  image:
    repository: ghcr.io/sw-campus/sw-campus-ai
    tag: develop
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi


# =========================
# Database configuration
# =========================
database:
  enabled: true
  externalService:
    name: postgres-service
    externalName: postgres
    port: 5432


# =========================
# ConfigMaps
# =========================
configMaps:
  server:
    enabled: true
  client:
    enabled: true
