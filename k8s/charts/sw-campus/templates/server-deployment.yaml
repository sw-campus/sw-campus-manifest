apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-server
  namespace: {{ .Values.global.namespace }}
  labels:
    app: sw-campus-server
spec:
  replicas: {{ .Values.server.replicas }}
  revisionHistoryLimit: {{ .Values.server.revisionHistoryLimit | default 3 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sw-campus-server
  template:
    metadata:
      labels:
        app: sw-campus-server
    spec:
      imagePullSecrets:
{{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        # Redis Sidecar Container
        {{- if and .Values.server.redis .Values.server.redis.enabled }}
        - name: redis
          image: "{{ .Values.server.redis.image | default "redis:7-alpine" }}"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        {{- end }}
        # Server Container
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.net.preferIPv4Stack=true"
            {{- if and .Values.server.redis .Values.server.redis.enabled }}
            # Redis 사이드카 사용 시 localhost로 연결
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6379"
            {{- end }}
{{- if .Values.server.env }}
{{- with .Values.server.env }}
{{- toYaml . | nindent 12 }}
{{- end }}
{{- end }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Values.server.configMap.name }}
{{- if .Values.server.serverSecret.enabled }}
            - secretRef:
                name: {{ .Values.server.serverSecret.name }}
{{- end }}
{{- if .Values.server.dbsecret.enabled }}
            - secretRef:
                name: {{ .Values.server.dbsecret.name }}
{{- end }}
{{- if .Values.server.awsSecret.enabled }}
            - secretRef:
                name: {{ .Values.server.awsSecret.name }}
{{- end }}
{{- if .Values.server.oauth2Secret.enabled }}
            - secretRef:
                name: {{ .Values.server.oauth2Secret.name }}
{{- end }}
{{- if .Values.server.resources }}
          resources:
{{ toYaml .Values.server.resources | nindent 12 }}
{{- end }}
{{- if .Values.server.gaSecret.enabled }}
          volumeMounts:
            - name: ga-credentials
              mountPath: /app/config/ga-credentials.json
              subPath: ga-credentials.json
              readOnly: true
{{- end }}
{{- if .Values.server.livenessProbe }}
          # livenessProbe 주석 처리 (Pod 재시작 문제 방지)
          # livenessProbe:
          # {{ toYaml .Values.server.livenessProbe | nindent 12 }}
{{- end }}
{{- if .Values.server.readinessProbe }}
          # readinessProbe 주석 처리 (현실적인 추천)
          # readinessProbe:
          # {{ toYaml .Values.server.readinessProbe | nindent 12 }}
{{- end }}
{{- if .Values.server.gaSecret.enabled }}
      volumes:
        - name: ga-credentials
          secret:
            secretName: {{ .Values.server.gaSecret.name }}
{{- end }}
