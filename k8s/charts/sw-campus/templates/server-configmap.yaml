{{- if .Values.configMaps.server.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.server.configMap.name }}
data:
  {{- $profile := "staging" }}
  {{- if eq .Values.global.namespace "release" }}
    {{- $profile = "prod" }}
  {{- end }}
  {{- if .Values.server.configMap.data }}
  {{- $data := .Values.server.configMap.data }}
  SPRING_PROFILES_ACTIVE: {{ $profile }}
  {{- range $key, $value := $data }}
  {{- if ne $key "SPRING_PROFILES_ACTIVE" }}
  {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
  {{- else }}
  SPRING_PROFILES_ACTIVE: {{ $profile }}
  DB_HOST: {{ .Values.database.externalService.name }}
  DB_PORT: "{{ .Values.database.externalService.port }}"
  {{- end }}
{{- end }}

