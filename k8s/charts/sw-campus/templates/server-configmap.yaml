{{- if .Values.configMaps.server.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.server.configMap.name }}
data:
  {{- if .Values.server.configMap.data }}
  {{- toYaml .Values.server.configMap.data | nindent 2 }}
  {{- else }}
  SPRING_PROFILES_ACTIVE: {{ .Values.global.namespace }}
  DB_HOST: {{ .Values.database.externalService.name }}
  DB_PORT: "{{ .Values.database.externalService.port }}"
  {{- end }}
{{- end }}

