{{- if .Values.ai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-campus-ai
  labels:
    app: sw-campus-ai
spec:
  replicas: {{ .Values.ai.replicas }}
  revisionHistoryLimit: {{ .Values.ai.revisionHistoryLimit | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sw-campus-ai
  template:
    metadata:
      labels:
        app: sw-campus-ai
    spec:
      imagePullSecrets:
{{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: ai
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports:
            - containerPort: 8000
          {{- if .Values.ai.resources }}
          resources:
{{ toYaml .Values.ai.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
{{- end }}
