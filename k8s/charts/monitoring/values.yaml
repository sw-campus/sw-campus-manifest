# Default values for monitoring
# 환경별 values 파일에서 오버라이드됨

# 운영 환경 기준 설정 (안전한 기본값)
# 개발 환경에서는 environments/develop-monitoring/values.yaml로 다운그레이드

# Global settings
global:
  namespace: monitoring
  env: release
  cluster: monitoring

monitoring:
  targetNamespace: release

grafana:
  enabled: true
  fullnameOverride: monitoring-grafana
  replicas: 2
  image:
    tag: "11.4.0"

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: false

  # Datasources provisioning
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://monitoring-prometheus:9090
          access: proxy
          isDefault: true
          editable: true
          jsonData:
            timeInterval: 15s
            timeout: 60
            cacheLevel: medium # 60초 캐싱
            incrementalQuerying: true
            incrementalQueryOverlapWindow: 10m

        - name: Loki
          type: loki
          uid: loki
          url: http://monitoring-loki:3100
          access: proxy
          editable: true
          jsonData:
            derivedFields:
              - datasourceUid: tempo
                matcherRegex: "\"traceId\"\\s*:\\s*\"([a-f0-9]+)\""
                name: TraceID
                url: "$${__value.raw}"

        - name: Tempo
          type: tempo
          uid: tempo
          url: http://monitoring-tempo:3200
          access: proxy
          editable: true
          jsonData:
            httpMethod: GET
            streamingEnabled:
              search: false # gRPC 스트리밍 비활성화 (포트 이슈 회피)
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
              filterByTraceID: true
              filterBySpanID: false
              tags:
                - key: service.name
                  value: service_name
            tracesToMetrics:
              datasourceUid: prometheus
              queries:
                - name: "Request Rate"
                  query: "sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))"
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            search:
              hide: false
            lokiSearch:
              datasourceUid: loki

  # 대시보드 사이드카 (auto-load from ConfigMaps with label)
  # Grafana chart 는 자동으로 emptyDir을 /tmp/dashboards에 마운트하여 readOnlyRootFilesystem과 호환
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /tmp/dashboards
      searchNamespace: monitoring

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  extraVolumes:
    - name: tmp-volume
      emptyDir: {}

  extraVolumeMounts:
    - name: tmp-volume
      mountPath: /tmp

  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

prometheus:
  enabled: true
  # TODO: High Availability 제한사항
  # - ReadWriteOnce PVC 사용으로 단일 복제본만 지원
  # - Pod 장애 시 메트릭 수집이 일시적으로 중단될 수 있음
  # - 자동 재시작으로 복구되나, 장애 시간 동안의 메트릭은 손실 가능
  #
  # HA 개선 방안 (향후 고려사항):
  #   1. ReadWriteMany PVC 사용 (NFS, Ceph 등 공유 스토리지)
  #   2. Thanos 도입 (장기 보관 + 고가용성 + 글로벌 쿼리)
  #   3. 외부 원격 스토리지 (S3, GCS 등)
  #   4. Prometheus Federation (여러 Prometheus 인스턴스 통합)
  replicas: 1
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  kubeStateMetricsTarget: kube-state-metrics.kube-system.svc.cluster.local:8080
  # 영구 저장소 설정
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gp2 # EKS: gp2/gp3 (gp3는 EBS CSI Driver 필요)
    accessModes:
      - ReadWriteOnce
  # 데이터 보관 기간
  # 10Gi PVC 대비 20% 여유 공간 확보 (9GB → 8GB)
  retention:
    time: 7d
    size: 8GB
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - monitoring-otel-collector.monitoring:8889

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  slack:
    webhookUrl: ""

loki:
  enabled: true
  replicas: 2
  image:
    repository: grafana/loki
    tag: "3.3.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3100
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    limits:
      max_streams_per_user: 5000
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      cardinality_limit: 100000

tempo:
  enabled: true
  fullnameOverride: monitoring-tempo # Pod/Service 이름 고정

  tempo:
    repository: grafana/tempo
    tag: "" # 비워두면 Chart.appVersion 사용
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://monitoring-prometheus:9090/api/v1/write"
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
        span_metrics:
          enable_target_info: true
      storage:
        path: "/var/tempo/metrics"
      traces_storage:
        path: "/var/tempo/wal"
      registry:
        collection_interval: 15s

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics

  singleBinary:
    replicas: 1
    persistence:
      enabled: true # 운영: 영구 스토리지
      size: 10Gi
      storageClassName: gp2 # EKS: gp2/gp3 (gp3는 EBS CSI Driver 필요)

  service:
    type: ClusterIP

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  global_overrides:
    max_bytes_per_trace: 10000000 # 10MB
    ingestion_rate_limit_bytes: 30000000 # 30MB/s
    ingestion_burst_size_bytes: 50000000 # 50MB

  traces:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

  compactor:
    config:
      compaction:
        block_retention: 168h # 7일 보관

otelCollector:
  enabled: true
  daemonset:
    enabled: true
  labels:
    app: otel-collector
  debug: false # 운영: 디버그 끔
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.143.1"
    pullPolicy: IfNotPresent

# ConfigMaps toggle
configMaps:
  grafanaDashboards:
    enabled: true # Grafana 공식 chart에서 dashboardsConfigMaps로 참조
  prometheusConfig:
    enabled: true
  prometheusRules:
    enabled: true
  lokiConfig:
    enabled: true
  otelCollectorConfig:
    enabled: true
