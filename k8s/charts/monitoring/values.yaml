# Default values for monitoring
# 환경별 values 파일에서 오버라이드됨

# Global settings
global:
  namespace: monitoring
  env: develop
  cluster: monitoring

# Monitoring target namespace (ArgoCD parameters로 오버라이드됨)
monitoring:
  targetNamespace: develop # 기본값: develop, 운영환경에서는 ArgoCD parameters로 release 설정

# Grafana configuration
grafana:
  enabled: true
  replicas: 2
  image:
    repository: grafana/grafana
    tag: "10.4.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  datasources:
    prometheus:
      name: Prometheus
      type: prometheus
      url: http://monitoring-prometheus:9090
      access: proxy
      isDefault: true

# Prometheus configuration
prometheus:
  enabled: true
  replicas: 1
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  kubeStateMetricsTarget: kube-state-metrics.kube-system.svc.cluster.local:8080
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - monitoring-otel-collector.monitoring:8889

# Alertmanager configuration
alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  slack:
    webhookUrl: ""

# Loki configuration
loki:
  enabled: true
  replicas: 1
  image:
    repository: grafana/loki
    tag: "3.3.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3100

# OpenTelemetry Collector configuration
otelCollector:
  enabled: true
  daemonset:
    enabled: true
  labels:
    app: otel-collector
  debug: false # 개발: true / 운영: false
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.143.1"
    pullPolicy: IfNotPresent

# ConfigMaps toggle
configMaps:
  grafanaDashboards:
    enabled: true
  grafanaDatasources:
    enabled: true
  prometheusConfig:
    enabled: true
  prometheusRules:
    enabled: true
  lokiConfig:
    enabled: true
  otelCollectorConfig:
    enabled: true
