# Default values for monitoring
# 환경별 values 파일에서 오버라이드됨

# Global settings
global:
  namespace: monitoring
  env: dev
  cluster: monitoring

# Grafana configuration
grafana:
  enabled: true
  replicas: 2
  image:
    repository: grafana/grafana
    tag: "10.4.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  datasources:
    prometheus:
      name: Prometheus
      type: prometheus
      url: http://monitoring-prometheus:9090
      access: proxy
      isDefault: true

# Prometheus configuration
prometheus:
  enabled: true
  replicas: 1
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  kubeStateMetricsTarget: kube-state-metrics.kube-system.svc.cluster.local:8080

# Alertmanager configuration
alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  slack:
    webhookUrl: ""   # 실제 값은 Secret으로 주입  

# Loki configuration
loki:
  enabled: true
  replicas: 1
  image:
    repository: grafana/loki
    tag: "2.9.6"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3100

# OpenTelemetry Collector configuration
otelCollector:
  enabled: true
  replicas: 2
  debug: false # 개발: true / 운영: false
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.96.0"
    pullPolicy: IfNotPresent

# ConfigMaps toggle
configMaps:
  grafanaDashboards:
    enabled: true
  grafanaDatasources:
    enabled: true
  prometheusConfig:
    enabled: true
  prometheusRules:
    enabled: true
  lokiConfig:
    enabled: true
  otelCollectorConfig:
    enabled: true

