# Default values for monitoring
# 환경별 values 파일에서 오버라이드됨

# 운영 환경 기준 설정 (안전한 기본값)
# 개발 환경에서는 environments/develop-monitoring/values.yaml로 다운그레이드

# Global settings
global:
  namespace: monitoring
  env: release
  cluster: monitoring

monitoring:
  targetNamespace: release

grafana:
  enabled: true
  replicas: 2
  image:
    repository: grafana/grafana
    tag: "10.4.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
  datasources:
    prometheus:
      name: Prometheus
      type: prometheus
      url: http://monitoring-prometheus:9090
      access: proxy
      isDefault: true

prometheus:
  enabled: true
  # PVC 사용 시 replicas: 1 권장 (ReadWriteOnce 제한)
  replicas: 1
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  kubeStateMetricsTarget: kube-state-metrics.kube-system.svc.cluster.local:8080
  # 영구 저장소 설정
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gp3 # EKS: gp3, k3s: local-path
    accessModes:
      - ReadWriteOnce
  # 데이터 보관 기간
  retention:
    time: 7d
    size: 9GB
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - monitoring-otel-collector.monitoring:8889

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  slack:
    webhookUrl: ""

loki:
  enabled: true
  replicas: 2
  image:
    repository: grafana/loki
    tag: "3.3.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3100
  config:
    limits:
      max_streams_per_user: 5000
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      cardinality_limit: 100000

tempo:
  enabled: true
  fullnameOverride: monitoring-tempo # Pod/Service 이름 고정

  tempo:
    repository: grafana/tempo
    tag: "" # 비워두면 Chart.appVersion 사용
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://monitoring-prometheus:9090/api/v1/write"
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
        span_metrics:
          enable_target_info: true
      storage:
        path: "/var/tempo/metrics"
      traces_storage:
        path: "/var/tempo/wal"
      registry:
        collection_interval: 15s

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics

  singleBinary:
    replicas: 1
    persistence:
      enabled: true # 운영: 영구 스토리지
      size: 10Gi
      storageClassName: gp3

  service:
    type: ClusterIP

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  global_overrides:
    max_bytes_per_trace: 10000000 # 10MB
    ingestion_rate_limit_bytes: 30000000 # 30MB/s
    ingestion_burst_size_bytes: 50000000 # 50MB

  traces:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

  compactor:
    config:
      compaction:
        block_retention: 168h # 7일 보관

otelCollector:
  enabled: true
  daemonset:
    enabled: true
  labels:
    app: otel-collector
  debug: false # 운영: 디버그 끔
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.143.1"
    pullPolicy: IfNotPresent

# ConfigMaps toggle
configMaps:
  grafanaDashboards:
    enabled: true
  grafanaDatasources:
    enabled: true
  prometheusConfig:
    enabled: true
  prometheusRules:
    enabled: true
  lokiConfig:
    enabled: true
  otelCollectorConfig:
    enabled: true
