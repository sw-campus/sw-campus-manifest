# Default values for monitoring
# 환경별 values 파일에서 오버라이드됨

# Global settings
global:
  namespace: monitoring

# Grafana configuration
grafana:
  enabled: true
  replicas: 2
  image:
    repository: grafana/grafana
    tag: "10.4.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000

# Prometheus configuration
prometheus:
  enabled: true
  replicas: 1
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090

# Loki configuration
loki:
  enabled: true
  replicas: 1
  image:
    repository: grafana/loki
    tag: "2.9.6"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3100

# Tempo configuration
tempo:
  enabled: true
  replicas: 2
  image:
    repository: grafana/tempo
    tag: "2.4.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3200

# Promtail configuration
promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "2.9.6"
    pullPolicy: IfNotPresent

# OpenTelemetry Collector configuration
otelCollector:
  enabled: true
  replicas: 2
  image:
    repository: otel/opentelemetry-collector
    tag: "0.96.0"
    pullPolicy: IfNotPresent

# ConfigMaps
configMaps:
  grafanaDashboards:
    enabled: true
  grafanaDatasources:
    enabled: true
  lokiConfig:
    enabled: true
  otelCollectorConfig:
    enabled: true
  promtailConfig:
    enabled: true
