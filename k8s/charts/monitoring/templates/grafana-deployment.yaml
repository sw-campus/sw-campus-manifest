{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.namespace }}-grafana
spec:
  replicas: {{ .Values.grafana.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.global.namespace }}-grafana
  template:
    metadata:
      labels:
        app: {{ .Values.global.namespace }}-grafana
        cluster: {{ .Values.global.namespace }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_PROTOCOL
              value: "http"
{{- if and .Values.grafana.ingress.enabled .Values.grafana.ingress.host }}
            - name: GF_SERVER_DOMAIN
              value: "{{ .Values.grafana.ingress.host }}"
  {{- if ne .Values.grafana.ingress.certificateArn "" }}
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ .Values.grafana.ingress.host }}/"
  {{- else }}
            - name: GF_SERVER_ROOT_URL
              value: "http://{{ .Values.grafana.ingress.host }}/"
  {{- end }}
{{- end }}
            - name: GF_SERVER_TRUSTED_PROXIES
              value: "*"

          volumeMounts:
            # Datasources
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources

            # Dashboards provisioning (디렉터리로!)
            - name: dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards

            # Dashboards JSON (실제 파일 위치)
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            
      volumes:
        # Datasources
        - name: datasources
          configMap:
            name: {{ .Values.global.namespace }}-grafana-datasources

        # Dashboards provisioning yaml
        - name: dashboards-provisioning
          configMap:
            name: {{ .Values.global.namespace }}-grafana-dashboard-provisioning

        # Dashboards JSON
        - name: dashboards
          configMap:
            name: {{ .Values.global.namespace }}-grafana-dashboards
{{- end }}
