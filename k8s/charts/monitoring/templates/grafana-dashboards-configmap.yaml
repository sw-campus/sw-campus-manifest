{{- if .Values.configMaps.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-grafana-dashboards
  labels:
    app: grafana
    grafana_dashboard: "1"
data:
  application-metrics.json: |
{{ .Files.Get "dashboards/application-metrics.json" | indent 4 }}

  kubernetes-cluster.json: |
{{ .Files.Get "dashboards/kubernetes-cluster.json" | indent 4 }}

{{- end }}
