{{- if .Values.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.namespace }}-loki
spec:
  replicas: {{ .Values.loki.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.global.namespace }}-loki
  template:
    metadata:
      labels:
        app: {{ .Values.global.namespace }}-loki
        cluster: {{ .Values.global.namespace }}
    spec:
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
{{- end }}

