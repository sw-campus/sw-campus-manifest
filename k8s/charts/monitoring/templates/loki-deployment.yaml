{{- if .Values.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.namespace }}-loki
spec:
  replicas: {{ .Values.loki.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.global.namespace }}-loki
  template:
    metadata:
      labels:
        app: {{ .Values.global.namespace }}-loki
        cluster: {{ .Values.global.namespace }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          args:
            - "-config.file=/etc/loki/loki.yml"
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Values.global.namespace }}-loki-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}

