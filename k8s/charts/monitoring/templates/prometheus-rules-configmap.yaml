{{- if .Values.configMaps.prometheusRules.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-prometheus-rules
  labels:
    app: prometheus
data:
  swcampus.rules.yml: |
    groups:
    - name: swcampus-k8s-basic
      rules:
      # 테스트용: 적용되면 무조건 pending/firing 뜸
      - alert: AlwaysFiringTest
        expr: vector(1)
        for: 1m
        labels:
          severity: info
          env: {{ .Values.global.env | default "dev" }}
        annotations:
          summary: "Prometheus rule load test (should fire)"
          description: "If you see this in Prometheus Alerts, rules are loaded OK."

      # Pod 재시작 증가
      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          env: {{ .Values.global.env | default "dev" }}
        annotations:
          summary: "Pod restarting detected"
          description: "A container restarted in the last 5 minutes."

      # CrashLoopBackOff
      - alert: PodCrashLoopBackOff
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 2m
        labels:
          severity: critical
          env: {{ .Values.global.env | default "dev" }}
        annotations:
          summary: "CrashLoopBackOff"
          description: "Pod is in CrashLoopBackOff."

      # 노드 Down
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          env: {{ .Values.global.env | default "dev" }}
        annotations:
          summary: "Node not ready"
          description: "A node is not Ready for 5 minutes."

    - name: swcampus-resource
      rules:
      # 컨테이너 CPU 과다
      - alert: HighContainerCPU
        expr: sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!="",pod!=""}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          env: {{ .Values.global.env | default "dev" }}
        annotations:
          summary: "High container CPU"
          description: "CPU usage is high for a pod."

      # 컨테이너 메모리 과다
      - alert: HighContainerMemory
        expr: sum by (namespace,pod) (container_memory_working_set_bytes{container!="",pod!=""}) > 1500000000
        for: 5m
        labels:
          severity: warning
          env: {{ .Values.global.env | default "dev" }}
        annotations:
          summary: "High container memory"
          description: "Memory working set is high for a pod."
{{- end }}
