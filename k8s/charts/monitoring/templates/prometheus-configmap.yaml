{{- if .Values.configMaps.prometheusConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: {{ .Values.global.cluster | default .Values.global.namespace }}
        env: {{ .Values.global.env | default "develop" }}

    # Alertmanager로 알림 보내기
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ .Values.global.namespace }}-alertmanager:9093

    # Prometheus 룰 파일 조회
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Prometheus itself
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # OTel Collector
      - job_name: otel-collector
        static_configs:
          - targets: ['{{ .Values.global.namespace }}-otel-collector:8889']

      # kube-state-metrics
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

      # Kubernetes pods (Application 메트릭)
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Values.monitoring.targetNamespace }} # develop or release
        
        relabel_configs:
          # annotation으로 스크랩 활성화된 Pod만
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
            
          # namespace 레이블 추가
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          
          # pod name 레이블 추가
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          
          # app 레이블 추가 (pod label app에서)
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

          # metrics path 설정
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # port 설정
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+):(?:\d+);(\d+)
            replacement: $1:$2

      # kubelet / cAdvisor (컨테이너 리소스)
      - job_name: kubelet
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
{{- end }}
