{{- if .Values.configMaps.prometheusConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: {{ .Values.global.namespace }}

    scrape_configs:
      # Prometheus 자체 메트릭
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # OTel Collector 메트릭
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['{{ .Values.global.namespace }}-otel-collector:8889']
            labels:
              component: 'otel-collector'

      # Kubernetes 상태 메트릭
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets:
              - 'kube-state-metrics.kube-system.svc.cluster.local:8080'
{{- end }}
