{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.namespace }}-prometheus
spec:
  replicas: {{ .Values.prometheus.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.global.namespace }}-prometheus
  template:
    metadata:
      labels:
        app: {{ .Values.global.namespace }}-prometheus
        cluster: {{ .Values.global.namespace }}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
          volumeMounts:
            # Prometheus main config (prometheus.yml)
            - name: config
              mountPath: /etc/prometheus
              readOnly: true

            # Alert rules (rules.yml)
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true

            # TSDB storage
            - name: storage
              mountPath: /prometheus

      volumes:
        # prometheus.yml
        - name: config
          configMap:
            name: {{ .Values.global.namespace }}-prometheus-config

        # alert rules ConfigMap
        - name: rules
          configMap:
            name: {{ .Values.global.namespace }}-prometheus-rules

        # local storage (dev only)
        - name: storage
          emptyDir: {}
{{- end }}
