{{- if .Values.tempo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.namespace }}-tempo
spec:
  type: {{ .Values.tempo.service.type }}
  ports:
    - port: {{ .Values.tempo.service.port }}
      targetPort: 3200
  selector:
    app: {{ .Values.global.namespace }}-tempo
{{- end }}

