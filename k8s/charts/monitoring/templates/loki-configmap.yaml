{{- if .Values.configMaps.lokiConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-loki-config
  namespace: {{ .Values.global.namespace }}
data:
  loki.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://{{ .Values.global.namespace }}-alertmanager:9093

    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h

      # ingestion rate 완화
      ingestion_rate_mb: {{ .Values.loki.config.limits.ingestion_rate_mb | default 50 }}
      ingestion_burst_size_mb: {{ .Values.loki.config.limits.ingestion_burst_size_mb | default 100 }}

      # per-stream 제한 완화
      per_stream_rate_limit: 30MB
      per_stream_rate_limit_burst: 60MB

      # stream 개수 제한 (운영 환경에서는 제한해야 함!)
      max_streams_per_user: {{ .Values.loki.config.limits.max_streams_per_user | default 5000 }}
      
      # 레이블 제한 추가
      max_label_names_per_series: 20
      max_label_name_length: 1024
      max_label_value_length: 2048

      # 쿼리 제한
      max_line_size: 256KB                    # 한 줄 최대 크기
      max_entries_limit_per_query: 5000       # 쿼리당 최대 엔트리
      max_query_length: 721h                  # 최대 쿼리 시간 범위 (30일)
      max_query_parallelism: 32               # 쿼리 병렬 처리
      
      # 청크 제한
      max_chunks_per_query: 2000000           # 쿼리당 최대 청크
      
      # 카디널리티 보호
      cardinality_limit: 100000               # 라벨 조합 최대값
{{- end }}
