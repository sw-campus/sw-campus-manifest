{{- if .Values.configMaps.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-grafana-dashboard-application
  labels:
    grafana_dashboard: "1"
data:
  application-metrics.json: |
{{ .Files.Get "dashboards/application-metrics.json" | indent 4 }}
{{- end }}
