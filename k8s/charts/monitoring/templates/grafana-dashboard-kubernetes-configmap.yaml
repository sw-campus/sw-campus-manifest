{{- if .Values.configMaps.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-grafana-dashboard-kubernetes
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-cluster.json: |
{{ .Files.Get "dashboards/kubernetes-cluster.json" | indent 4 }}
{{- end }}
