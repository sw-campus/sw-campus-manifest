{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.namespace }}-otel-collector
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning

      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024

      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      # Loki가 실제로 사용하는 라벨 정의
      resource:
        attributes:
          - action: insert
            key: loki.resource.labels
            value: |
              k8s.namespace.name,
              k8s.pod.name,
              k8s.container.name,
              k8s.node.name

    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:3100/loki/api/v1/push

      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        const_labels:
          cluster: {{ .Values.global.namespace }}

      {{- if .Values.otelCollector.debug }}
      logging:
        loglevel: info
      {{- end }}

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors:
            - k8sattributes
            - resource
            - batch
          exporters:
            {{- if .Values.otelCollector.debug }}
            - logging
            {{- end }}
            - loki

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters:
            - prometheus
{{- end }}
