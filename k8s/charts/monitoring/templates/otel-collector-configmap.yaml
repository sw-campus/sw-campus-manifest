{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        operators:
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send  # JSON 아니면 그냥 보냄 (평문도 수집)

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.container.name
            - k8s.pod.name

      resource:
        attributes:
          - action: upsert
            key: namespace
            from_attribute: k8s.namespace.name
          - action: upsert
            key: app
            from_attribute: k8s.container.name
          - action: upsert
            key: pod
            from_attribute: k8s.pod.name
      
      # Transform: OTLP LogRecord → 구조화
      transform:
        log_statements:
          - context: log
            statements:
              # Body를 message로
              - set(attributes["message"], body)
              
              # Severity를 level로
              - set(attributes["level"], severity_text)
              
              # Logger 이름
              - set(attributes["logger"], instrumentation_scope.name)
              
              # Trace context
              - set(attributes["trace_id"], trace_id.string) where trace_id.string != nil
              - set(attributes["span_id"], span_id.string) where span_id.string != nil

      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:{{ .Values.loki.service.port }}/loki/api/v1/push
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, resource, transform, batch]
          exporters: [loki]

        # traces:
        #   receivers: [otlp]
        #   processors: [k8sattributes, resource, batch]
        #   exporters: []  # 나중에 Tempo

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
{{- end }}
