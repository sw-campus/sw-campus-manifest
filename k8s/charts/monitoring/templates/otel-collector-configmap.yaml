{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning

      # OTLP 수신 (Spring Boot에서 push)
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # OTel 자체 메트릭
      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector-self
              static_configs:
                - targets: ["127.0.0.1:8888"]

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name

      attributes:
        actions:
          - key: app
            from_attribute: k8s.container.name
            action: upsert

      resource:
        attributes:
          - action: insert
            key: loki.resource.labels
            value: k8s.namespace.name, app

      batch:
        timeout: 5s
        send_batch_size: 1024


    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:{{ .Values.loki.service.port }}/loki/api/v1/push
      prometheus:
        endpoint: "0.0.0.0:8889" # 🔥 Prometheus가 scrape할 유일한 엔드포인트
        
    service: 
      pipelines:
        logs:
          receivers: [filelog] # 파일에서 로그 수집
          processors: [k8sattributes, attributes, resource, batch]
          exporters: [loki] # Loki로 전송
        metrics:
          receivers: [otlp, prometheus] # OTLP + 자체 메트릭
          processors: [k8sattributes, batch]
          exporters: [prometheus] # Prometheus exporter로 노출
{{- end }}
