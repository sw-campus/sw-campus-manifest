{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/{{ .Values.monitoring.targetNamespace }}_*/*/*.log
        exclude:
          - /var/log/pods/monitoring_*/*/*.log
        start_at: beginning

        operators:
          # k8s 로그 형식 파싱
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            parse_from: body
            parse_to: attributes
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          
          # 실제 로그 내용을 body로 이동
          - type: move
            from: attributes.log
            to: body

          # JSON 파싱
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send  # JSON 아니면 그냥 보냄 (평문도 수집)

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # 1. k8s metadata 추가
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.container.name
            - k8s.pod.name

      # 2. 리소스 속성 변환
      resource:
        attributes:
          - action: upsert
            key: namespace
            from_attribute: k8s.namespace.name
          - action: insert
            key: service.name
            from_attribute: k8s.container.name
          - action: upsert
            key: pod
            from_attribute: k8s.pod.name

      # 3. 배치 처리
      batch:
        timeout: 10s
        send_batch_size: 1024

      # 4. trace_id 속성 복사 (Loki-Tempo 연동용)
      # LogstashEncoder의 traceId/spanId를 Loki가 인식하는 trace_id/span_id로 복사
      attributes/trace:
        actions:
          - key: trace_id
            from_attribute: traceId
            action: upsert
          - key: span_id
            from_attribute: spanId
            action: upsert

    exporters:
      # Loki OTLP 수신기로 전송
      otlphttp/loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:3100/otlp
        tls:
          insecure: true
      
      otlp/tempo:
        endpoint: {{ .Values.global.namespace }}-tempo:4317
        tls:
          insecure: true
      
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      telemetry:
        metrics:
          level: detailed

      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, resource, attributes/trace, batch]
          exporters: [otlphttp/loki]

        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [otlp/tempo]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
{{- end }}
