{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otelCollector.labels.app }}
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning

      otlp:
        protocols:
          grpc:
          http:

      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector-self
              static_configs:
                - targets: ["127.0.0.1:8888"]

    processors:
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      attributes:
        actions:
          - key: env
            from_attribute: k8s.namespace.name
            action: upsert

      resource:
        attributes:
          - action: insert
            key: loki.resource.labels
            value: k8s_namespace_name,k8s_pod_name,k8s_container_name

      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      loki:
        endpoint: http://monitoring-loki:3100/loki/api/v1/push

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, attributes, resource, batch]
          exporters: [loki]

        metrics:
          # receivers: [otlp]
          receivers: [prometheus]
          processors: [k8sattributes, batch]
          exporters: [prometheus]
{{- end }}
