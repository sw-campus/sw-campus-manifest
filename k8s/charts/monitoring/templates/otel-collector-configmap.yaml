{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      # 노드 로그 수집
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning

      # 메트릭용 OTLP (유지)
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024

      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      attributes:
        actions:
          - key: deployment.environment
            from_attribute: k8s.namespace.name
            action: upsert

      # Loki 라벨 승격
      resource:
        attributes:
          - action: insert
            key: loki.resource.labels
            value: >
              deployment.environment,
              k8s.namespace.name,
              k8s.pod.name,
              k8s.container.name,
              k8s.node.name

    exporters:
      # Loki 로그 exporter
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:3100/loki/api/v1/push

      # 메트릭용 Prometheus exporter
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        const_labels:
          cluster: {{ .Values.global.namespace }}

      {{- if .Values.otelCollector.debug }}
      logging:
        loglevel: info
      {{- end }}

    service:
      pipelines:
        # 로그 파이프라인 (filelog → loki)
        logs:
          receivers: [filelog]
          processors:
            - k8sattributes
            - attributes
            - resource
            - batch
          exporters:
            {{- if .Values.otelCollector.debug }}
            - logging
            {{- end }}
            - loki

        # 메트릭 파이프라인 (기존 유지)
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters:
            - prometheus
{{- end }}
