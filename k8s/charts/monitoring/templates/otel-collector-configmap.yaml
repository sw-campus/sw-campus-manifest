{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/monitoring_*otel-collector*/*.log
        start_at: beginning
        operators:
          # k8s 로그 형식 파싱
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            parse_from: body
            parse_to: attributes
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          
          # 실제 로그 내용을 body로 이동
          - type: move
            from: attributes.log
            to: body

          # JSON 파싱
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send  # JSON 아니면 그냥 보냄 (평문도 수집)

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.container.name
            - k8s.pod.name

      resource:
        attributes:
          - action: upsert
            key: namespace
            from_attribute: k8s.namespace.name
          - action: upsert
            key: app
            from_attribute: k8s.container.name
          - action: upsert
            key: pod
            from_attribute: k8s.pod.name

      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:{{ .Values.loki.service.port }}/loki/api/v1/push
        # 명시적 라벨 설정
        labels:
          resource:
            namespace: namespace
            app: app
        
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [loki]

        # traces:
        #   receivers: [otlp]
        #   processors: [k8sattributes, resource, batch]
        #   exporters: []  # 나중에 Tempo

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
{{- end }}
