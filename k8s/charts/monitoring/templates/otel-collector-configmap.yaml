{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/develop_*/*/*.log
          - /var/log/pods/release_*/*/*.log
        exclude:
          - /var/log/pods/monitoring_*/*/*.log        # 모든 모니터링 로그는 제외
          - /var/log/pods/*sw-campus-server*/*/*.log  # 중복 방지를 위해 server 로그는 제외
        start_at: beginning

        operators:
          # k8s 로그 형식 파싱
          - type: regex_parser
            regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            parse_from: body
            parse_to: attributes
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          
          # 실제 로그 내용을 body로 이동
          - type: move
            from: attributes.log
            to: body

          # JSON 파싱
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: send  # JSON 아니면 그냥 보냄 (평문도 수집)

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # 1. k8s metadata 추가
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.container.name
            - k8s.pod.name

      # 2. namespace 필터링 (develop/release만)
      filter/namespace:
        logs:
          log_record:
            - 'attributes["k8s.namespace.name"] == "develop" or attributes["k8s.namespace.name"] == "release"'
        traces:
          span:
            - 'attributes["k8s.namespace.name"] == "develop" or attributes["k8s.namespace.name"] == "release"'

      # 3. 리소스 속성 변환
      resource:
        attributes:
          - action: upsert
            key: namespace
            from_attribute: k8s.namespace.name
          - action: upsert
            key: app
            from_attribute: k8s.container.name
          - action: upsert   # pod는 label이 아니고 attributes
            key: pod
            from_attribute: k8s.pod.name

      # 4. 배치 처리
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp/loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:3100/otlp
        tls:
          insecure: true
      
      otlp/tempo:
        endpoint: {{ .Values.global.namespace }}-tempo:4317
        tls:
          insecure: true
      
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      telemetry:
        metrics:
          level: detailed

      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, filter/namespace, resource, batch]
          exporters: [otlphttp/loki]

        traces:
          receivers: [otlp]
          processors: [k8sattributes, filter/namespace, batch]
          exporters: [otlp/tempo]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
{{- end }}
