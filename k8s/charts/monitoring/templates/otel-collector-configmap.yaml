{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
      
        operators:
          # 로그 레벨 추출
          - type: regex_parser
            regex: '^\S+\s+\S+\s+\[.*?\]\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)'
            parse_from: body
            parse_to: attributes
        
          # severity 매핑
          - type: severity_parser
            parse_from: attributes.level
            mapping:
              trace: trace
              debug: debug
              info: info
              warn: warning
              error: error
              fatal: fatal

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.container.name
            - k8s.pod.name

      resource:
        attributes:
          # loki 레이블: namespace, app
          - action: upsert
            key: namespace
            from_attribute: k8s.namespace.name
          - action: upsert
            key: app
            from_attribute: k8s.container.name
          
          # pod는 attribute로만 (레이블 아님!)
          - action: upsert
            key: pod
            from_attribute: k8s.pod.name

      batch:
        timeout: 10s
        send_batch_size: 2000

    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:{{ .Values.loki.service.port }}/loki/api/v1/push

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [loki]

        # traces:
        #   receivers: [otlp]
        #   processors: [k8sattributes, resource, batch]
        #   exporters: []  # 나중에 Tempo

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
{{- end }}
