{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning

      # 메트릭용 OTLP
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024

      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      attributes:
        actions:
          - key: env
            from_attribute: k8s.namespace.name
            action: upsert

    exporters:
      # Loki exporter 
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:3100/loki/api/v1/push
        labels:
          exporter: otel
          env: env
          namespace: k8s.namespace.name
          pod: k8s.pod.name
          container: k8s.container.name
          node: k8s.node.name

      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        const_labels:
          cluster: {{ .Values.global.namespace }}

      {{- if .Values.otelCollector.debug }}
      logging:
        loglevel: info
      {{- end }}

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors:
            - k8sattributes
            - attributes
            - batch
          exporters:
            {{- if .Values.otelCollector.debug }}
            - logging
            {{- end }}
            - loki

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters:
            - prometheus
{{- end }}
