{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector-self
              static_configs:
                - targets: ["127.0.0.1:8888"]

    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.container.name

      resource:
        attributes:
          - action: upsert
            key: app
            from_attribute: k8s.container.name

          - action: insert
            key: loki.resource.labels
            value: k8s.namespace.name, app

      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:{{ .Values.loki.service.port }}/loki/api/v1/push

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, resource, batch]
          exporters: [loki]

        metrics:
          receivers: [otlp, prometheus]
          processors: [k8sattributes, batch]
          exporters: [prometheus]
{{- end }}
