{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
data:
  otel-collector.yml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: true

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      attributes:
        actions:
          - key: env
            from_attribute: k8s.namespace.name
            action: upsert

      resource:
        attributes:
          - action: insert
            key: loki.resource.labels
            value: k8s.namespace.name,k8s.pod.name,k8s.container.name,service.name

      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:{{ .Values.loki.service.port }}/loki/api/v1/push

      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, attributes, resource, batch]
          exporters: [loki]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
{{- end }}
