{{- if .Values.configMaps.otelCollectorConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-otel-collector-config
data:
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    processors:
      # 로그 묶어서 전송
      batch:
        timeout: 5s
        send_batch_size: 1024

      # Kubernetes 메타데이터 추출
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      # 환경 정보 보강
      attributes:
        actions:
          - key: deployment.environment
            from_attribute: k8s.namespace.name
            action: upsert

      # Loki 라벨로 승격할 필드 정의
      resource:
        attributes:
          - action: insert
            key: loki.resource.labels
            value: >
              service.name,
              deployment.environment,
              k8s.pod.name,
              k8s.container.name,
              level,
              trace_id

    exporters:
      # Loki
      loki:
        endpoint: http://{{ .Values.global.namespace }}-loki:3100/loki/api/v1/push

      # Prometheus
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        const_labels:
          cluster: {{ .Values.global.namespace }}

      {{- if .Values.otelCollector.debug }}
      logging:
        loglevel: info
      {{- end }}

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors:
            - k8sattributes
            - attributes
            - resource
            - batch
          exporters:
            {{- if .Values.otelCollector.debug }}
            - logging
            {{- end }}
            - loki

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters:
            - prometheus
{{- end }}
