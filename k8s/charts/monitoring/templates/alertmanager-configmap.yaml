{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.namespace }}-alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "slack-dev"
      group_by: ["alertname", "namespace", "app", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

      routes:
        - matchers:
            - env="release"
          receiver: "slack-prod"

    receivers:
      - name: "slack-dev"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
            channel: "#alert-dev"
            send_resolved: true
            title: "[개발] {{`{{ .CommonLabels.alertname }}`}} ({{`{{ .CommonLabels.severity }}`}})"
            text: >-
              {{`{{ range .Alerts }}`}}
              *요약:* {{`{{ .Annotations.summary }}`}}
              *설명:* {{`{{ .Annotations.description }}`}}
              *namespace:* {{`{{ .Labels.namespace }}`}}  *app:* {{`{{ .Labels.app }}`}}  *pod:* {{`{{ .Labels.pod }}`}}
              {{`{{ end }}`}}

      - name: "slack-prod"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
            channel: "#alert-prod"
            send_resolved: true
            title: "[운영] {{`{{ .CommonLabels.alertname }}`}} ({{`{{ .CommonLabels.severity }}`}})"
            text: >-
              {{`{{ range .Alerts }}`}}
              *요약:* {{`{{ .Annotations.summary }}`}}
              *설명:* {{`{{ .Annotations.description }}`}}
              *namespace:* {{`{{ .Labels.namespace }}`}}  *app:* {{`{{ .Labels.app }}`}}  *pod:* {{`{{ .Labels.pod }}`}}
              {{`{{ end }}`}}
{{- end }}