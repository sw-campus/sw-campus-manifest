apiVersion: v2
name: monitoring
description: Monitoring Stack Helm Chart (Grafana, Prometheus, Loki, Tempo)
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: tempo
    version: "1.24.3" # 최신 안정 버전 (Single Binary 모드)
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  # 프로덕션에서는 tempo-distributed 사용 권장
