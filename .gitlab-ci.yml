stages:
  - validate


# YAML 문법 검증
validate-yaml:
  stage: validate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(develop|release|main)$/
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install yamllint --break-system-packages
  script:
    - |
      echo "Validating YAML files..."

      # k8s 폴더 검증
      if [ -d "k8s" ]; then
        yamllint -d "{extends: relaxed, rules: {line-length: disable}}" k8s/
      fi

      # argocd 폴더 검증
      if [ -d "argocd" ]; then
        yamllint -d "{extends: relaxed, rules: {line-length: disable}}" argocd/
      fi

      echo "YAML validation passed!"


# Helm Chart 검증 (있는 경우)
validate-helm:
  stage: validate
  image: alpine/helm:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - k8s/**/*
    - if: $CI_COMMIT_BRANCH =~ /^(develop|release|main)$/
      changes:
        - k8s/**/*
  script:
    - |
      echo "Validating Helm charts..."

      # environments 폴더의 values.yaml로 템플릿 검증
      for env_dir in k8s/environments/*/; do
        if [ -d "$env_dir" ]; then
          env_name=$(basename "$env_dir")
          echo "Checking $env_name environment..."

          # Helm 차트가 있으면 lint 실행
          if [ -f "k8s/Chart.yaml" ]; then
            helm lint k8s/ -f "$env_dir/values.yaml" || true
          fi
        fi
      done

      echo "Helm validation completed!"
  allow_failure: true
